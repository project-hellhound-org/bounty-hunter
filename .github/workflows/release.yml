name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check — all modules
        run: |
          echo "Running syntax checks on all Python files..."
          find hellhound/ -name "*.py" -exec python -m py_compile {} \;
          echo "All syntax checks passed."

      - name: Verify module metadata
        run: |
          python - << 'EOF'
          import os, sys
          errors = []
          modules_dir = "hellhound/modules"
          for root, dirs, files in os.walk(modules_dir):
              for f in files:
                  if not f.endswith(".py") or f.startswith("__"):
                      continue
                  path = os.path.join(root, f)
                  content = open(path).read()
                  missing = []
                  if "DESCRIPTION" not in content:
                      missing.append("DESCRIPTION")
                  if "CATEGORY" not in content:
                      missing.append("CATEGORY")
                  if missing:
                      errors.append(f"{path}: missing {', '.join(missing)}")
          if errors:
              print("Module metadata errors:")
              for e in errors:
                  print(f"  ✗ {e}")
              sys.exit(1)
          print(f"All modules verified successfully.")
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            README.md
            requirements.txt
            LICENSE
            scaffold_module.py
            CONTRIBUTING.md
