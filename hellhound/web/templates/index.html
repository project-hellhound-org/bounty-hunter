<!DOCTYPE html>
<html>
<head>
  <h2>HELLHOUND Dashboard</h2>
  <p>Target: <strong style="color:#00ff41">{{ target }}</strong></p>
  <div id="terminal"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { background:black; color:#00ff41; font-family: monospace; padding:20px; }
    #terminal { border:1px solid #00ff41; padding:10px; height:400px; overflow-y:auto; }
    input, button { background:black; color:#00ff41; border:1px solid #00ff41; padding:5px; }
  </style>
</head>
<body>

<h2>HELLHOUND Dashboard</h2>

<input id="target" placeholder="Target IP or domain">
<button onclick="start()">Start Hunt</button>

<div id="terminal"></div>

<script>
const socket = io();
const term = document.getElementById("terminal");

socket.on("log", data => {
  term.innerHTML += data.message + "<br>";
  term.scrollTop = term.scrollHeight;
});

function start() {
  const target = document.getElementById("target").value;
  socket.emit("start_scan", { target });
}
</script>

</body>
</html>
